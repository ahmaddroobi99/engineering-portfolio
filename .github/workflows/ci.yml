name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src/routes src/components src/data src/lib/theme.tsx src/lib/search.ts src/lib/compare-store.ts src/lib/utils.ts
      - run: npm run build
